# Sentence reader evaluation set.
#
# Each item is a sentence with its expected split (`words[].surface`, in order, concatenating to
# the sentence) and, per word, the dictionary entries the search should return when that word is
# selected (`relevant`, matched by `kanji` (main written form) and/or `kana`). Words without
# `relevant` (punctuation) only count for split scoring. With `ordered: true` the labels must be
# found in the given order and hit@1 needs the first one: when JMdict has an entry for the
# inflected form itself (早く, 知らない, ございます), it has to rank before the normalized word.
# Exception: a verb stem before に (買いに行く) is the verb, not the noun 買い.
# A phrase JMdict lists as an expression verb (見に行く, 雨が降る, 風邪を引く) is one word, labelled with
# that entry; te-form + auxiliary (ている, てみる) stays split.
#
# Split conventions: inflections stay attached to their verb/adjective (食べませんでした), particles
# and the copula are separate words, JMdict grammar expressions are their own word and split off
# the preceding verb stem (食べ | なければならない).
#
# Evaluated by `lib/search/tests/sentence_reader_eval.rs` (Jotoba/Search).
