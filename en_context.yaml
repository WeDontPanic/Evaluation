language: English
# Context-sensitive query set.
# Each group (comment header) is one ambiguous English term whose correct
# Japanese translation depends on context. Every Japanese word gets several
# differently-phrased English queries to test context disambiguation.
tests:
  items:
  # ===== break =====
  # 割れる — to break / shatter (intransitive: glass, porcelain, screens)
  - query: my glass broke
    relevant:
    - kanji: 割れる
  - query: the window broke
    relevant:
    - kanji: 割れる
  - query: the plate shattered
    relevant:
    - kanji: 割れる
  - query: my phone screen cracked
    relevant:
    - kanji: 割れる
  # 割る — to break / crack (transitive: glass, eggs, splitting)
  - query: break glass
    relevant:
    - kanji: 割る
    - kanji: 割れる
    num_relevant: 1
  - query: breaking a window
    relevant:
    - kanji: 割る
    - kanji: 割れる
    num_relevant: 1
  - query: crack an egg
