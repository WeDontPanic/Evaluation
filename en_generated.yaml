language: English
# LLM-GENERATED English->Japanese ranking set (written by Claude, 2026-10-14).
# Kept separate from the human-written en*.yaml sets on purpose: never merge.
#
# Purpose: measure/tune RANKING quality (MAP over genuinely relevant words),
# NOT dictionary coverage. JMdict glosses are noisy for search: 犬 carries the
# gloss "useless" (cf. 犬死に), yet a learner typing "useless" wants 無駄 /
# 役に立たない / 無用. A gloss match only makes a word a CANDIDATE; this set
# asks whether the answer a fluent bilingual speaker would give to "what's the
# Japanese for <query>?" (most natural, common sense) ranks near the top.
#
# Coverage: ~400 queries, weighted toward polysemous / noisy-gloss queries
# (light, fine, free, clear, sharp, to play, to take, change, charge, bill,
# patient, can, ...), plus loanword traps (mansion -> 屋敷 not マンション,
# steering wheel -> ハンドル, outlet -> コンセント), usually-kana everyday words,
# multi-word phrases, and smaller verb/adjective/adverb/noun slices. Every item
# carries a trailing "# <group>" tag for slicing. No query duplicates a query
# in the existing en*.yaml sets.
#
# How labels were chosen:
#  * Answers were decided FIRST from bilingual judgment, without looking at any
#    Jotoba/production ranking output (no ~/bin/jotoba, no search runs), so the
#    set does not inherit the current ranker's bias.
#  * Each label was then verified against the project's JMdict
#    (joto_tool/build/resources/words/JMdict): `kanji:` = the entry's FIRST
#    (main) kanji form, `kana:` = the entry's first reading (used for
#    kana-only entries). Where a main kanji form is shared by several entries
#    with different readings (e.g. 床 ゆか/とこ, 下手 へた/したて, 辛い つらい/からい)
#    a `kana:` field pins the intended reading. Rare variants were replaced by
#    the JMdict main form (e.g. 気づく not 気付く, 風邪をひく not 風邪を引く).
#    Labels/queries with no fitting JMdict entry were dropped.
#  * 1-4 labels per query; `num_relevant: 1` where several translations are
#    each fully acceptable and the user only needs one of them near the top
#    (typical for polysemous queries: any of the main senses is a good hit).
#  * Known harness caveat: a kana-only label matches every entry whose reading
#    equals it, so some katakana labels also match unrelated homophones
#    (コップ "cop", バイト "byte", ミス "Miss", マウス "mouth"). These homophones
#    do not carry the query's gloss, so the effect on MAP should be negligible.
#  * Revision (same day, user-approved): labels widened where a distinct,
#    equally natural JMdict entry had been missed: native verbs next to
#    する-nouns (受かる, 備える, 愚痴る, 文句を言う, 嫌う, 調べる, 息をする, ...) and
#    separate everyday variants (すいません, さよなら, 有難うございます, 何で, ウザイ).
#    Loose fits were rejected (e.g. 落ちる for generic "to fail", 見込む,
#    整える, 退く, 吸う for "to breathe").
tests:
  items:
  # ===== noisy-gloss: the query word appears as a weak/figurative gloss on many unrelated entries (e.g. 犬 'useless') (13 queries) =====
