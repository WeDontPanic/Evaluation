language: English
# Direct-hit query set for niche / lower-frequency words.
# Purpose: verify that specialized, less-common Japanese words and translations
# are still FOUND and ranked near the top when queried by their direct English
# meaning. Each entry lists 1-2 correct Japanese targets (max 2); when 2 are
# listed BOTH must be found (no num_relevant), to guard against niche synonyms
# dropping out. Targets exclude ultra-core vocab (見る/読む/行く…). Roughly half
# the queries are multi-word phrases (e.g. "wonder child", "false accusation").
