# Japanese (native) word search evaluation: a Japanese query and the entries it should return.
#
# Same format as en.yaml (joto_tool `evaluate` can run it against the API); `group` is an extra
# field used by the offline test `lib/search/tests/native_search_eval.rs` (Jotoba/Search).
# `language` is the gloss language only.
#
# Groups:
# - uk_homograph: kana query whose answer is a usually-kana word with a kanji main form (する → 為る),
#   competing with kanji homographs that are normally written in kanji (擦る)
# - kana_reading: kana query whose answer is normally written in kanji (がくせい → 学生); guards
#   against over-boosting usually-kana words
# - kana_word: words that are written in kana only
# - kanji: exact kanji queries (controls)
language: English
tests:
  items:
  # ---------------------------------------------------------------- uk_homograph
  - { group: uk_homograph, query: する, relevant: [{ kanji: 為る, kana: する }] }
  - { group: uk_homograph, query: いる, relevant: [{ kanji: 居る, kana: いる }] }
  - { group: uk_homograph, query: ある, relevant: [{ kanji: 有る, kana: ある }] }
